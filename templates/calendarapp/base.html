<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prints Calendar</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f5f5f7;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .day-cell-today {
            border: 2px solid #0d6efd;
            box-shadow: 0 0 0.5rem rgba(13, 110, 253, 0.4);
            background-color: #e7f1ff;
        }

        .day-cell-outside {
            color: #adb5bd;
            background-color: #f8f9fa;
        }

        .event-chip {
            font-size: 0.78rem;
            padding: 0.1rem 0.35rem;
            border-radius: 999px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .status-dot {
            display: inline-block;
            width: 0.6rem;
            height: 0.6rem;
            border-radius: 50%;
            margin-right: 0.2rem;
        }

        .status-researching { background-color: #6c757d; }  /* gray */
        .status-preparing   { background-color: #ffc107; }  /* yellow */
        .status-bidding     { background-color: #198754; }  /* green */
        .status-passed      { background-color: #adb5bd; }  /* muted */

        .event-chip-researching {
            background-color: #e9ecef;
            color: #495057;
        }

        .event-chip-preparing {
            background-color: #fff3cd;
            color: #856404;
        }

        .event-chip-bidding {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .event-chip-passed {
            background-color: #f8f9fa;
            color: #6c757d;
            text-decoration: line-through;
        }

        .sidebar-heading {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6c757d;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'calendarapp:month_view' %}">
            🖼️ Prints Calendar
        </a>
        <a class="btn btn-outline-light btn-sm" href="{% url 'calendarapp:event_add' %}">
            + Add Sale
        </a>
    </div>
</nav>

<div class="container mb-4">
    {% block content %}{% endblock %}
</div>
</body>
</html>
