<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prints Calendar</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

        <style>
        body {
            background-color: #f5f5f7;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .day-cell-today {
            border: 2px solid #0d6efd;
            box-shadow: 0 0 0.5rem rgba(13, 110, 253, 0.4);
            background-color: #e7f1ff;
        }

        .day-cell-outside {
            color: #adb5bd;
            background-color: #f8f9fa;
        }

        .event-chip {
            font-size: 0.78rem;
            padding: 0.1rem 0.35rem;
            border-radius: 999px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .status-dot {
            display: inline-block;
            width: 0.6rem;
            height: 0.6rem;
            border-radius: 50%;
            margin-right: 0.2rem;
        }

        .status-researching { background-color: #6c757d; }  /* gray */
        .status-preparing   { background-color: #ffc107; }  /* yellow */
        .status-bidding     { background-color: #198754; }  /* green */
        .status-passed      { background-color: #adb5bd; }  /* muted */

        .event-chip-researching {
            background-color: #e9ecef;
            color: #495057;
        }

        .event-chip-preparing {
            background-color: #fff3cd;
            color: #856404;
        }

        .event-chip-bidding {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .event-chip-passed {
            background-color: #f8f9fa;
            color: #6c757d;
            text-decoration: line-through;
        }

        .sidebar-heading {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6c757d;
        }

        @media (max-width: 1399.98px) {
            .event-chip {
                font-size: 0.7rem;
                padding: 0.05rem 0.25rem;
            }

            .table thead th {
                font-size: 0.8rem;
            }

            .table td {
                padding: 0.3rem;
            }
        }

        /* -------- New helpers for “easy-read” layout -------- */

        .main-shell {
            max-width: 1200px;
        }

        .page-subtitle {
            font-size: 0.875rem;
            color: #6c757d;
        }

        /* Day view cards */
        .event-card {
            border-radius: 0.75rem;
            background-color: #ffffff;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
        }

        .event-card-header {
            gap: 1rem;
        }

        .event-card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.15rem;
        }

        .event-card-meta {
            font-size: 0.8rem;
            color: #6c757d;
        }

        .event-card-actions .btn {
            font-size: 0.75rem;
        }

        /* Research notes layout */
        .analysis-shell {
            max-width: 1200px;
        }

        .analysis-sidebar-card {
            border-radius: 0.75rem;
            background-color: #ffffff;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
            padding: 1rem 1.25rem;
        }

        .analysis-sidebar-card .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6c757d;
        }

        .analysis-notes-textarea {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            min-height: 70vh;
            padding: 1rem 1.1rem;
            border-radius: 0.75rem;
        }

        .analysis-notes-textarea:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }

     .day-link {
            display: block;
            width: 100%;
            height: 100%;
            padding: 0.35rem;            /* similar to your td .p-1 */
            text-decoration: none;
            color: inherit;
        }

        .day-link:hover {
            background-color: rgba(13, 110, 253, 0.06);  /* soft hover */
        }
    .analysis-preview {
        background-color: #ffffff;
        border-radius: 0.75rem;
        padding: 1rem 1.1rem;
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.06);
        max-height: 70vh;
        overflow-y: auto;
        font-size: 0.9rem;
    }

    .analysis-preview h1,
    .analysis-preview h2,
    .analysis-preview h3 {
        margin-top: 1rem;
        margin-bottom: 0.5rem;
        font-weight: 600;
    }

    .analysis-preview p,
    .analysis-preview ul,
    .analysis-preview ol {
        margin-bottom: 0.5rem;
    }

    .analysis-preview ul,
    .analysis-preview ol {
        padding-left: 1.25rem;
    }

    .analysis-preview hr {
        margin: 0.75rem 0;
    }
    </style>

</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'calendarapp:month_view' %}">
            🖼️ Prints Calendar
        </a>
        <a class="btn btn-outline-light btn-sm" href="{% url 'calendarapp:event_add' %}">
            + Add Sale
        </a>
    </div>
</nav>

<div class="container mb-4">
    {% block content %}{% endblock %}
</div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</body>
</html>
