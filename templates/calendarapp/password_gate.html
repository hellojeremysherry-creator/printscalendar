{% extends "calendarapp/base.html" %}

{% block content %}
<div class="main-shell mx-auto" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-3">Prints Calendar Access</h4>
            <p class="text-muted small mb-3">
                This site is currently restricted. Enter the shared access password to continue.
            </p>

            {% if error %}
                <div class="alert alert-danger py-2 small">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_password" class="form-label">Access password</label>
                    <input type="password"
                           class="form-control"
                           id="id_password"
                           name="password"
                           autocomplete="off"
                           autofocus>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Enter
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
